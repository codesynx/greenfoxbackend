# ===============================
# GreenFox Backend Configuration
# ===============================

spring.application.name=GreenFox

# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# Database Configuration (Render PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://dpg-d51jfjv6s9ss73eno9vg-a.frankfurt-postgres.render.com:5432/greenfox_db_yodf?sslmode=require
spring.datasource.username=greenfox_db_yodf_user
spring.datasource.password=lRotdPluIeBgZaNdngc3Gu5riOZoC2EH
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Redis Configuration (for OTP storage)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# JWT Configuration
# ===============================
app.jwt.secret=your-256-bit-secret-key-here-change-in-production-minimum-32-chars
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# ===============================
# Twilio Configuration (OTP)
# ===============================
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:your-twilio-account-sid}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:your-twilio-auth-token}
app.twilio.phone-number=${TWILIO_PHONE_NUMBER:+1234567890}
app.twilio.otp-expiration-minutes=5
app.twilio.otp-length=6
app.twilio.test-numbers=+77475680246,+77775556666
app.twilio.test-otp-code=123456

# ===============================
# GCP Cloud Storage Configuration
# ===============================
app.gcp.project-id=${GCP_PROJECT_ID:greenfox-481812}
app.gcp.bucket-name=${GCP_BUCKET_NAME:greenfox-storage}
app.gcp.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS}

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# OpenAPI / Swagger Configuration
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===============================
# Logging
# ===============================
logging.level.com.greenfox=DEBUG
logging.level.org.springframework.security=DEBUG
