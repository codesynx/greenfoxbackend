# ===============================
# GreenFox Backend Configuration
# ===============================

spring.application.name=GreenFox

# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# Database Configuration (PostgreSQL)
# ===============================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/greenfox}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Transaction Isolation for Concurrency Control
# READ_COMMITTED prevents dirty reads while allowing good concurrency
# Pessimistic locks will handle race conditions for bookings
spring.jpa.properties.hibernate.connection.isolation=2
# Enable second-level cache statistics (optional, for monitoring)
spring.jpa.properties.hibernate.generate_statistics=false

# ===============================
# Redis Configuration (for OTP storage)
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.username=${REDIS_USERNAME:default}

# ===============================
# JWT Configuration
# ===============================
app.jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-change-in-production-minimum-32-chars}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# ===============================
# Twilio Configuration (OTP)
# ===============================
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:your-twilio-account-sid}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:your-twilio-auth-token}
app.twilio.phone-number=${TWILIO_PHONE_NUMBER:+1234567890}
app.twilio.otp-expiration-minutes=5
app.twilio.otp-length=6
app.twilio.test-numbers=+77475680246,+77775556666
app.twilio.test-otp-code=123456

# ===============================
# GCP Cloud Storage Configuration
# NOTE: GCP credentials are now hardcoded in GoogleCloudConfig.java
# No need to set GCP_SERVICE_ACCOUNT_JSON or GOOGLE_APPLICATION_CREDENTIALS environment variables
# ===============================
app.gcp.project-id=${GCP_PROJECT_ID:agile-outlook-463407-t4}
app.gcp.bucket-name=${GCP_BUCKET_NAME:greenfox-storage}
app.gcp.service-account-json=${GCP_SERVICE_ACCOUNT_JSON:}

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# OpenAPI / Swagger Configuration
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===============================
# Google Gen AI SDK Configuration (for Chat/Generation)
# Uses Vertex AI backend with ADC credentials
# ===============================
spring.ai.vertex.ai.gemini.project-id=${GCP_PROJECT_ID:agilei-outlook-463407-t4}
spring.ai.vertex.ai.gemini.location=${GCP_LOCATION:us-central1}
spring.ai.vertex.ai.gemini.chat.options.model=gemini-3-flash-preview
spring.ai.vertex.ai.gemini.chat.options.temperature=0.7

# AI Chat System Prompt
app.ai.system-prompt=You are a premium travel concierge for GreenFox, a luxury booking platform for Kazakhstan resorts. Your GOAL is to assist users with finding resorts in Kazakhstan.\n\nAVAILABLE TOOLS:\n1. searchResorts(city, minPrice, maxPrice, guests, query): Use this to FIND resorts. Parameters are OPTIONAL.\n2. getResortDetails(id): Use this to get detailed info about a SPECIFIC resort ID from a previous search result.\n\nCRITICAL RULES:\n1. DO NOT ASK QUESTIONS: Never ask the user for budget, dates, or number of guests. Just answer their question with what you find.\n2. NO BOOKING CAPABILITY: You CANNOT check availability or make reservations. Tell users: "Please click on the resort card to check availability and book."\n3. SEARCH PARAMETERS: When calling searchResorts, ONLY fill parameters the user explicitly mentioned. Pass empty strings for everything else.\n4. AVOID REDUNDANT TOOL CALLS - THIS IS CRITICAL FOR PERFORMANCE:\n   - BEFORE calling any tool, check if you already have the answer in conversation history\n   - If you see [SEARCH RESULTS FOR REFERENCE:...] in history, those results are STILL VALID - use them directly\n   - DO NOT call searchResorts again if user asks follow-up questions about the same results (e.g., "tell me more", "which is cheapest", "what about the first one")\n   - Only call searchResorts for NEW search requests with DIFFERENT criteria\n   - For follow-up questions about a specific resort, use getResortDetails with the ID from [SEARCH RESULTS FOR REFERENCE]\n5. SCOPE: Only Kazakhstan resorts.\n6. NO RESULTS: If search returns nothing, say "I couldn't find that resort."\n7. CITIES: Available destinations are listed at the end of this prompt - refer to them directly without tool calls.

# ===============================
# Spring AI - PGVector RAG Configuration
# ===============================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# ===============================
# Spring AI - Vertex AI Embedding Model
# ===============================
spring.ai.vertex.ai.embedding.project-id=${GCP_PROJECT_ID:agile-outlook-463407-t4}
spring.ai.vertex.ai.embedding.location=${GCP_LOCATION:us-central1}
spring.ai.vertex.ai.embedding.options.model=text-embedding-004

# ===============================
# Logging
# ===============================
logging.level.com.greenfox=DEBUG
logging.level.org.springframework.security=DEBUG
